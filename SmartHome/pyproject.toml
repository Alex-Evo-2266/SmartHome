[tool.poetry]
name = "smarthome"
version = "0.1.0"
description = ""
authors = ["Alex-Evo-2266 <ghbdtn2266@mail.ru>"]
readme = "README.md"
package-mode = false

[tool.poetry.dependencies]
python = "^3.12"
fastapi = "^0.115.8"
ormar = {extras = ["mysql"], version = "^0.20.2"}
alembic = "^1.14.1"
pyyaml = "^6.0.2"
uvicorn = "^0.34.0"
paho-mqtt = "^2.1.0"
websockets = "^14.2"
pika = "^1.3.2"
aio-pika = "^9.5.5"
async-lru = "^2.0.5"
yeelight = "^0.7.16"
apscheduler = "^3.11.3"


[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest (>=9.1.1,<10.0.0)",
    "pytest-asyncio (>=1.4.0,<2.0.0)",
    "freezegun (>=1.5.5,<2.0.0)"
]
